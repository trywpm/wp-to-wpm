---
name: migration

on:
  schedule:
    - cron: '*/15 * * * *'
  workflow_dispatch:

concurrency:
  group: migration

permissions: {}

jobs:
  migrate:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    strategy:
      fail-fast: false
      matrix:
        type:
          - theme
          - plugin
    steps:
      - name: checkout
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 #v5.0.0

      - name: pull image
        run: docker pull ghcr.io/trywpm/wp-to-wpm:latest

      - name: run migration
        run: |
          docker run --rm \
            -e WORKERS=2 \
            -e WPM_TOKEN=${{ secrets.WPM_TOKEN }} \
            -e PACKAGE_TYPE=${{ matrix.type }} \
            -v ${{ github.workspace }}:/code \
            ghcr.io/trywpm/wp-to-wpm:latest migrate
        env:
          WORKERS: 2

      - name: set user
        run: |
          git config --global user.name "thelovekeshbot"
          git config --global user.email "bots@thelovekesh.com"

      - name: commit changes
        run: |
          git pull origin main
          git add .${{ matrix.type }}_last_rev
          git commit -m "Update .${{ matrix.type }}_last_rev" || echo "No changes to commit"

      - name: push changes
        run: git push origin main
