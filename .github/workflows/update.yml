---
name: update

on:
  workflow_dispatch:
    inputs:
      revalidate:
        description: 'Prune non-permanent closures before update'
        type: boolean
        default: false

concurrency:
  group: migrate-pipeline
  cancel-in-progress: false

permissions: {}

jobs:
  run:
    runs-on: ubuntu-latest
    permissions:
      packages: read
      contents: write
    steps:
      - name: checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: registry login
        uses: docker/login-action@4907a6ddec9925e35a0a9e82d7399ccc52663121 # v4.1.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: pull image
        run: docker pull ghcr.io/trywpm/wp-to-wpm:latest

      - name: setup git user
        run: |
          git config --global user.name "thelovekeshbot"
          git config --global user.email "bots@thelovekesh.com"

      - name: run revalidate
        if: ${{ inputs.revalidate }}
        run: |
          docker run --rm \
            -v ${{ github.workspace }}:/code \
            ghcr.io/trywpm/wp-to-wpm:latest revalidate

      - name: run update
        run: |
          docker run --rm \
            -v ${{ github.workspace }}:/code \
            ghcr.io/trywpm/wp-to-wpm:latest update

      - name: commit refreshed state
        run: |
          git pull origin main
          git add themes.json plugins.json conflicts.json closed-themes.json closed-plugins.json
          if git diff --cached --quiet; then
            echo "no changes to commit"
            exit 0
          fi
          SUBJECT="update: refresh whitelists and closure status"
          if [ "${{ inputs.revalidate }}" = "true" ]; then
            SUBJECT="update: revalidate closures, refresh whitelists"
          fi
          BODY=$(printf 'themes=%s plugins=%s conflicts=%s closed-themes=%s closed-plugins=%s' \
            "$(jq 'length' themes.json)" \
            "$(jq 'length' plugins.json)" \
            "$(jq 'length' conflicts.json)" \
            "$(jq 'length' closed-themes.json)" \
            "$(jq 'length' closed-plugins.json)")
          git commit -m "$SUBJECT" -m "$BODY"

      - name: push
        run: |
          for attempt in 1 2 3 4 5; do
            if ! git pull --rebase origin main; then
              git rebase --abort 2>/dev/null || true
              echo "::warning::pull --rebase failed on attempt $attempt"
              sleep $((attempt * 2))
              continue
            fi
            if git push origin main; then
              echo "push succeeded on attempt $attempt"
              exit 0
            fi
            echo "::warning::push failed on attempt $attempt"
            sleep $((attempt * 2))
          done
          echo "::error::failed to push after 5 attempts"
          exit 1

      - name: backfill migrate plugins
        run: |
          docker run --rm \
            -e CI=true \
            -e CONCURRENCY=2 \
            -e WPM_TOKEN=${{ secrets.WPM_TOKEN }} \
            -e PACKAGE_TYPE=plugin \
            -e NEW_RELIC_LICENSE_KEY=${{ secrets.NEW_RELIC_LICENSE_KEY }} \
            -v ${{ github.workspace }}:/code \
            ghcr.io/trywpm/wp-to-wpm:latest backfill-migrate

      - name: backfill migrate themes
        run: |
          docker run --rm \
            -e CI=true \
            -e CONCURRENCY=2 \
            -e WPM_TOKEN=${{ secrets.WPM_TOKEN }} \
            -e PACKAGE_TYPE=theme \
            -e NEW_RELIC_LICENSE_KEY=${{ secrets.NEW_RELIC_LICENSE_KEY }} \
            -v ${{ github.workspace }}:/code \
            ghcr.io/trywpm/wp-to-wpm:latest backfill-migrate
