---
name: update themes and plugins list

on:
  workflow_run:
    workflows: ["update themes and plugins conflicts list"]
    types:
      - completed

concurrency:
  group: ${{ github.repository }}-${{ github.workflow }}
  cancel-in-progress: true

permissions: {}

env:
  FEATURE_BRANCH: update-themes-plugins-list

jobs:
  fetch-versions:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      packages: read
      contents: write
      pull-requests: write
    strategy:
      fail-fast: false
      matrix:
        type:
          - theme
          - plugin
    steps:
      - name: checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: registry login
        uses: docker/login-action@4907a6ddec9925e35a0a9e82d7399ccc52663121 #v4.1.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: pull image
        run: docker pull ghcr.io/trywpm/wp-to-wpm:latest

      - name: check if feature branch exists
        id: remote-branch
        run: |
          echo "exists=$([[ -z $(git ls-remote --heads origin ${{ env.FEATURE_BRANCH }}) ]] && echo "0" || echo "1")" >> $GITHUB_OUTPUT

      - name: create feature branch
        if: steps.remote-branch.outputs.exists == '0'
        run: |
          git checkout -b ${{ env.FEATURE_BRANCH }}

      - name: checkout feature branch
        if: steps.remote-branch.outputs.exists == '1'
        run: |
          git fetch --all --prune
          git checkout ${{ env.FEATURE_BRANCH }}
          git pull --no-rebase

      - name: update ${{ matrix.type }}s list
        run: |
          docker run --rm \
            -e WORKERS=100 \
            -e PACKAGE_TYPE=${{ matrix.type }} \
            -v ${{ github.workspace }}:/code \
            ghcr.io/trywpm/wp-to-wpm:latest update

      - name: check for changes
        id: data-files
        run: |
          IS_MODIFIED=$(git ls-files --modified ${{ matrix.type }}s.json)
          if [ -n "$IS_MODIFIED" ]; then
            echo "modified=true" >> $GITHUB_OUTPUT
          else
            echo "::notice::no files were modified"
            exit 0
          fi

      - name: setup git user
        if: steps.data-files.outputs.modified == 'true'
        run: |
          git config --global user.name "thelovekeshbot"
          git config --global user.email "bots@thelovekesh.com"

      - name: commit changes
        if: steps.data-files.outputs.modified == 'true'
        run: |
          git add ${{ matrix.type }}s.json conflicts.json
          git commit -m "update ${{ matrix.type }}s list on $(date -u)" --signoff

      - name: push changes
        if: steps.data-files.outputs.modified == 'true'
        run: |
          git pull --rebase origin ${{ env.FEATURE_BRANCH }} || true
          git push origin ${{ env.FEATURE_BRANCH }}

      - name: create pull request
        run: |
          body="## Summary
          This PR updates the themes and plugins list used for migrations."
          delimiter="${body//$'\n'/'%0A'}"
          echo "body<<${delimiter}" >> $GITHUB_OUTPUT
          echo "$body" >> $GITHUB_OUTPUT
          echo "${delimiter}" >> $GITHUB_OUTPUT
          gh pr create --base main --head ${{ env.FEATURE_BRANCH }} --title "Update themes and plugins list" --body "$body" --reviewer thelovekesh || true
        env:
          GH_TOKEN: ${{ github.token }}
