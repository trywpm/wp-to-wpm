---
name: update

on:
  workflow_dispatch:
    inputs:
      revalidate:
        description: 'Prune non-permanent closures before update'
        type: boolean
        default: false

concurrency:
  group: migrate-pipeline
  cancel-in-progress: false

permissions: {}

jobs:
  run:
    runs-on: ubuntu-latest
    permissions:
      packages: read
      contents: write
    steps:
      - name: checkout
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          persist-credentials: false

      - name: registry login
        uses: docker/login-action@650006c6eb7dba73a995cc03b0b2d7f5ca915bee # v4.2.0
        with:
          username: thelovekesh
          password: ${{ secrets.DOCKER_TOKEN }}

      - name: pull image
        run: docker pull trywpm/wp-to-wpm:latest

      - name: setup git user
        run: |
          git config --global user.name "thelovekeshbot"
          git config --global user.email "bots@thelovekesh.com"

      - name: run revalidate
        if: ${{ inputs.revalidate }}
        run: |
          docker run --rm \
            -v ${{ github.workspace }}:/code \
            trywpm/wp-to-wpm:latest revalidate

      - name: run update
        run: |
          docker run --rm \
            -v ${{ github.workspace }}:/code \
            trywpm/wp-to-wpm:latest update

      - name: commit refreshed state
        run: |
          git add state/themes.json state/plugins.json state/conflicts.json state/closed-themes.json state/closed-plugins.json
          if git diff --cached --quiet; then
            echo "no changes to commit"
            exit 0
          fi
          SUBJECT="update: refresh whitelists and closure status"
          if [ "${{ inputs.revalidate }}" = "true" ]; then
            SUBJECT="update: revalidate closures, refresh whitelists"
          fi
          BODY=$(printf 'themes=%s plugins=%s conflicts=%s closed-themes=%s closed-plugins=%s' \
            "$(jq 'length' state/themes.json)" \
            "$(jq 'length' state/plugins.json)" \
            "$(jq 'length' state/conflicts.json)" \
            "$(jq 'length' state/closed-themes.json)" \
            "$(jq 'length' state/closed-plugins.json)")
          git commit -m "$SUBJECT" -m "$BODY"

      - name: push
        run: |
          for attempt in 1 2 3 4 5; do
            if ! git pull --rebase "$REPO_URL" main; then
              git rebase --abort 2>/dev/null || true
              echo "::warning::pull --rebase failed on attempt $attempt"
              sleep $((attempt * 2))
              continue
            fi
            if git push "$REPO_URL" main; then
              echo "push succeeded on attempt $attempt"
              exit 0
            fi
            echo "::warning::push failed on attempt $attempt"
            sleep $((attempt * 2))
          done
          echo "::error::failed to push after 5 attempts"
          exit 1
        env:
          REPO_URL: 'https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git'

      - name: backfill migrate plugins
        run: |
          docker run --rm \
            -e CI=true \
            -e CONCURRENCY=2 \
            -e WPM_TOKEN=${{ secrets.WPM_TOKEN }} \
            -e PACKAGE_TYPE=plugin \
            -e NEW_RELIC_LICENSE_KEY=${{ secrets.NEW_RELIC_LICENSE_KEY }} \
            -v ${{ github.workspace }}:/code \
            trywpm/wp-to-wpm:latest backfill-migrate

      - name: backfill migrate themes
        run: |
          docker run --rm \
            -e CI=true \
            -e CONCURRENCY=2 \
            -e WPM_TOKEN=${{ secrets.WPM_TOKEN }} \
            -e PACKAGE_TYPE=theme \
            -e NEW_RELIC_LICENSE_KEY=${{ secrets.NEW_RELIC_LICENSE_KEY }} \
            -v ${{ github.workspace }}:/code \
            trywpm/wp-to-wpm:latest backfill-migrate
