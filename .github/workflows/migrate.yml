---
name: migrate

on:
  workflow_dispatch:

concurrency:
  group: migrate-pipeline
  cancel-in-progress: false

permissions: {}

jobs:
  migrate:
    runs-on: ubuntu-latest
    permissions:
      packages: read
      contents: write
    strategy:
      fail-fast: false
      matrix:
        type:
          - theme
          - plugin
    steps:
      - name: checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - name: registry login
        uses: docker/login-action@650006c6eb7dba73a995cc03b0b2d7f5ca915bee # v4.2.0
        with:
          username: thelovekesh
          password: ${{ secrets.DOCKER_TOKEN }}

      - name: pull image
        run: docker pull trywpm/wp-to-wpm:latest

      - name: run migration
        run: |
          docker run --rm \
            -e CI=true \
            -e CONCURRENCY=2 \
            -e WPM_TOKEN=${{ secrets.WPM_TOKEN }} \
            -e PACKAGE_TYPE=${{ matrix.type }} \
            -e NEW_RELIC_LICENSE_KEY=${{ secrets.NEW_RELIC_LICENSE_KEY }} \
            -v ${{ github.workspace }}:/code \
            trywpm/wp-to-wpm:latest migrate

      - name: setup git user
        run: |
          git config --global user.name "thelovekeshbot"
          git config --global user.email "bots@thelovekesh.com"

      - name: commit state
        run: |
          git add state/${{ matrix.type }}_last_rev
          if git diff --cached --quiet; then
            echo "no rev change; nothing to commit"
            exit 0
          fi
          OLD=$(git show HEAD:state/${{ matrix.type }}_last_rev 2>/dev/null || echo 0)
          NEW=$(cat state/${{ matrix.type }}_last_rev)
          git commit -m "migrate(${{ matrix.type }}): advance svn rev ${OLD}..${NEW}"

      - name: push
        run: |
          for attempt in 1 2 3 4 5; do
            if ! git pull --rebase "$REPO_URL" main; then
              git rebase --abort 2>/dev/null || true
              echo "::warning::pull --rebase failed on attempt $attempt"
              sleep $((attempt * 2))
              continue
            fi
            if git push "$REPO_URL" main; then
              echo "push succeeded on attempt $attempt"
              exit 0
            fi
            echo "::warning::push failed on attempt $attempt"
            sleep $((attempt * 2))
          done
          echo "::error::failed to push after 5 attempts"
          exit 1
        env:
          REPO_URL: 'https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git'
