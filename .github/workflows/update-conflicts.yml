---
name: update themes and plugins conflicts list

on:
  schedule:
    - cron: '0 5 * * 6'
  workflow_dispatch:

concurrency:
  group: ${{ github.repository }}-${{ github.workflow }}
  cancel-in-progress: true

permissions: {}

env:
  FEATURE_BRANCH: update-themes-plugins-list

jobs:
  fetch-versions:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: checkout
        uses: actions/checkout@1af3b93b6815bc44a9784bd300feb67ff0d1eeb3 # v6.0.0

      - name: check if feature branch exists
        id: remote-branch
        run: |
          echo "exists=$([[ -z $(git ls-remote --heads origin ${{ env.FEATURE_BRANCH }}) ]] && echo "0" || echo "1")" >> $GITHUB_OUTPUT

      - name: create feature branch
        if: steps.remote-branch.outputs.exists == '0'
        run: |
          git checkout -b ${{ env.FEATURE_BRANCH }}

      - name: checkout feature branch
        if: steps.remote-branch.outputs.exists == '1'
        run: |
          git fetch --all --prune
          git checkout ${{ env.FEATURE_BRANCH }}
          git pull --no-rebase

      - name: install subversion
        run: sudo apt-get install -y subversion

      - name: update themes and plugins list
        shell: bash
        run: |
          set -euo pipefail

          themes_file=$(mktemp)
          plugins_file=$(mktemp)
          trap 'rm -f "$themes_file" "$plugins_file"' EXIT

          svn list https://themes.svn.wordpress.org | sed 's:/$::' | sort > "$themes_file"
          svn list https://plugins.svn.wordpress.org | sed 's:/$::' | sort > "$plugins_file"

          comm -12 "$themes_file" "$plugins_file" \
            | jq -R -s 'split("\n") | map(select(length > 0))' > conflicts.json

          echo "updated conflicts.json"

      - name: check for changes
        id: data-files
        run: |
          IS_MODIFIED=$(git ls-files --modified conflicts.json)
          if [ -n "$IS_MODIFIED" ]; then
            echo "modified=true" >> $GITHUB_OUTPUT
          else
            echo "::notice::no files were modified"
            exit 0
          fi

      - name: setup git user
        if: steps.data-files.outputs.modified == 'true'
        run: |
          git config --global user.name "thelovekeshbot"
          git config --global user.email "bots@thelovekesh.com"

      - name: commit changes
        if: steps.data-files.outputs.modified == 'true'
        run: |
          git add plugins.json themes.json conflicts.json
          git commit -m "update conflicts list on $(date -u)" --signoff

      - name: push changes
        if: steps.data-files.outputs.modified == 'true'
        run: |
          git pull --rebase origin ${{ env.FEATURE_BRANCH }} || true
          git push origin ${{ env.FEATURE_BRANCH }}

      - name: create pull request
        run: |
          body="## Summary
          This PR updates the themes and plugins list used for migrations."
          delimiter="${body//$'\n'/'%0A'}"
          echo "body<<${delimiter}" >> $GITHUB_OUTPUT
          echo "$body" >> $GITHUB_OUTPUT
          echo "${delimiter}" >> $GITHUB_OUTPUT
          gh pr create --base main --head ${{ env.FEATURE_BRANCH }} --title "Update themes and plugins list" --body "$body" --reviewer thelovekesh || true
        env:
          GH_TOKEN: ${{ github.token }}
