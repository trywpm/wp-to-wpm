---
name: revalidate

on:
  workflow_dispatch:

concurrency:
  group: migrate-pipeline
  cancel-in-progress: false

permissions: {}

jobs:
  run:
    runs-on: ubuntu-latest
    permissions:
      packages: read
      contents: write
    steps:
      - name: checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: registry login
        uses: docker/login-action@4907a6ddec9925e35a0a9e82d7399ccc52663121 # v4.1.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: pull image
        run: docker pull ghcr.io/trywpm/wp-to-wpm:latest

      - name: run revalidate
        run: |
          docker run --rm \
            -v ${{ github.workspace }}:/code \
            ghcr.io/trywpm/wp-to-wpm:latest revalidate

      - name: setup git user
        run: |
          git config --global user.name "thelovekeshbot"
          git config --global user.email "bots@thelovekesh.com"

      - name: commit pruned closures
        run: |
          git pull origin main
          git add closed-themes.json closed-plugins.json
          git diff --cached --quiet || git commit -m "revalidate: prune non-permanent closures"

      - name: push
        run: |
          git pull --rebase origin main || true
          git push origin main

      - name: run update (repopulate closures)
        run: |
          docker run --rm \
            -v ${{ github.workspace }}:/code \
            ghcr.io/trywpm/wp-to-wpm:latest update

      - name: commit refreshed state
        run: |
          git pull origin main
          git add themes.json plugins.json conflicts.json closed-themes.json closed-plugins.json
          git diff --cached --quiet || git commit -m "update (post-revalidate): refresh whitelists and closures"

      - name: push
        run: |
          git pull --rebase origin main || true
          git push origin main

      - name: backfill migrate plugins
        run: |
          docker run --rm \
            -e CONCURRENCY=2 \
            -e WPM_TOKEN=${{ secrets.WPM_TOKEN }} \
            -e PACKAGE_TYPE=plugin \
            -v ${{ github.workspace }}:/code \
            ghcr.io/trywpm/wp-to-wpm:latest backfill-migrate

      - name: backfill migrate themes
        run: |
          docker run --rm \
            -e CONCURRENCY=2 \
            -e WPM_TOKEN=${{ secrets.WPM_TOKEN }} \
            -e PACKAGE_TYPE=theme \
            -v ${{ github.workspace }}:/code \
            ghcr.io/trywpm/wp-to-wpm:latest backfill-migrate
